<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!--
      axet.flows function node sandbox'ı (bkz. app-electron/main/flowSandbox.ts).
      Ağ YOK: default-src 'none' fetch/XHR/WebSocket/img/font/frame isteklerini
      kapatıyor. 'unsafe-eval' yalnızca kullanıcı kodunun `new Function` ile
      derlenmesi için var; satır içi betik yok, yalnızca paketin kendi dosyaları.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; form-action 'none'; base-uri 'none'" />
    <title>flow sandbox</title>
  </head>
  <body>
    <script type="module" src="/src/flowSandbox/main.ts"></script>
  </body>
</html>
