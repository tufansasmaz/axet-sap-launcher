# LLM-eval suite for the `matnr-ext` pattern (CHAR18 -> MATNR / CHAR40).

- id: clean-char18-no-offset
  description: lv_material TYPE char18 used only as MATNR (high)
  input_payload:
    cluster_id: c-0301
    check_id: FDT_VAR_FIELD_LENGTH::MATNR_EXT
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_MAT_BROWSE
      include: ZR_MAT_BROWSE
      line: 17
      message: "MATNR length extension required: lv_material TYPE char18"
    context:
      var_name: lv_material
      var_type: char18
      uses_offset_length: false
      uses_concatenate_fixed_width: false
      rfc_partner_older: false
  expected_fix_shape: mechanical
  expected_confidence_range: [0.85, 1.00]

- id: offset-length-present
  description: lv_matnr+0(18) access present (silent truncation risk — low)
  input_payload:
    cluster_id: c-0302
    check_id: FDT_VAR_FIELD_LENGTH::MATNR_EXT
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_MAT_BAD
      include: ZR_MAT_BAD
      line: 32
      message: "MATNR length extension required with OFFSET/LENGTH"
    context:
      var_name: lv_matnr
      var_type: char18
      uses_offset_length: true
  expected_fix_shape: mechanical
  expected_confidence_range: [0.00, 0.69]

