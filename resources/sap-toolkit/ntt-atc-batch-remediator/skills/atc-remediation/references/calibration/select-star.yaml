# LLM-eval suite for the `select-star` pattern.
# Each case feeds a synthetic cluster (1 finding + downstream-usage context)
# into PatchGenerator and asserts the LLM produces a Patch whose
# `fix_shape` + `confidence` match the expectations.
#
# Loaded by tests/test_evals_runner.py — gated by @pytest.mark.llm.

- id: ekko-tiny-4-cols
  description: SELECT * on EKKO where downstream uses only 4 columns (canonical high-confidence)
  input_payload:
    cluster_id: c-0001
    check_id: CL_CI_TEST_DB_SEL_NESTED_LOOPS::SELECT_STAR
    finding_count: 1
    sample_finding:
      object_type: CLAS
      object_name: ZCL_EKKO_READER
      include: ZCL_EKKO_READER==========CM001
      line: 47
      message: "SELECT * on EKKO without explicit field list"
    context:
      ddic_table: EKKO
      downstream_field_uses_on_itab: [EBELN, BSART, BUKRS, LIFNR]
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

