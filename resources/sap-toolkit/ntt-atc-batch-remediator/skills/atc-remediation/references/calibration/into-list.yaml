# LLM-eval suite for the `into-list` pattern.

- id: makt-static-host-vars
  description: SELECT SINGLE on MAKT with statically-declared host vars (mechanical)
  input_payload:
    cluster_id: c-0101
    check_id: CL_CI_TEST_OPEN_SQL::MISSING_INTO_LIST
    finding_count: 1
    sample_finding:
      object_type: CLAS
      object_name: ZCL_MAKT_LOOKUP
      include: ZCL_MAKT_LOOKUP==========CM001
      line: 22
      message: "INTO list missing @-escape on MAKT"
    context:
      ddic_table: MAKT
      host_vars: [lv_matnr, lv_maktx, lv_input]
  expected_fix_shape: mechanical
  expected_confidence_range: [0.85, 1.00]

