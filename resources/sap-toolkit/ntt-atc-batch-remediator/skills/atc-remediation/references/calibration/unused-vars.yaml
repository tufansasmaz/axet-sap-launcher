    sample_finding:
      object_type: CLAS
      object_name: ZCL_REGISTRY
      include: ZCL_REGISTRY==========CCDEF
      line: 9
      message: "Unused public CLASS DATA mv_temp"
    context:
      unused_var: mv_temp
      is_public_class_data: true
