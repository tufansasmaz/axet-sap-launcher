# LLM-eval suite for the `unused-vars` pattern.

- id: trivial-local-three
  description: "Local DATA: block with three vars — only middle one unused (high)"
  input_payload:
    cluster_id: c-0701
    check_id: SLIN_UNUSED_VAR
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_LOCAL_VARS
      include: ZR_LOCAL_VARS
      line: 8
      message: "Unused variable lv_dummy"
    context:
      unused_var: lv_dummy
      scope: local
      dynamic_assign_in_unit: false
      is_public_class_data: false
  expected_fix_shape: mechanical
  expected_confidence_range: [0.85, 1.00]

- id: dynamic-assign-present
  description: Variable name appears in a dynamic ASSIGN — low confidence
  input_payload:
    cluster_id: c-0702
    check_id: SLIN_UNUSED_VAR
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_DYN_ASSIGN
      include: ZR_DYN_ASSIGN
      line: 19
      message: "Variable lv_dummy looks unused but dynamic ASSIGN exists"
    context:
      unused_var: lv_dummy
      scope: local
      dynamic_assign_in_unit: true
  expected_fix_shape: mechanical
  expected_confidence_range: [0.00, 0.69]

- id: public-class-data
