# LLM-eval suite for the `check-top-of-form` pattern.

- id: top-of-form-first-stmt
  description: CHECK is the first executable statement of the FORM (high)
  input_payload:
    cluster_id: c-0801
    check_id: Y_CHECK_CHECK_STATEMENT_POS
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_FORM_FIRST
      include: ZR_FORM_FIRST
      line: 33
      message: "CHECK at top of FORM"
    context:
      form: process_row
      position: first_executable
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

- id: nested-if-judgment
  description: CHECK sits inside a nested IF (judgment-leaning, low)
  input_payload:
    cluster_id: c-0802
    check_id: Y_CHECK_CHECK_STATEMENT_POS
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_FORM_NESTED
      include: ZR_FORM_NESTED
      line: 44
      message: "CHECK inside nested IF"
    context:
      form: dispatch
      position: nested_if
  expected_fix_shape: context
  expected_confidence_range: [0.00, 0.69]

- id: top-of-loop
  description: CHECK is at top of a LOOP body (rewrite as CONTINUE)
  input_payload:
    cluster_id: c-0803
    check_id: Y_CHECK_CHECK_IN_LOOP
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_LOOP_CHECK
      include: ZR_LOOP_CHECK
      line: 18
      message: "CHECK at top of LOOP"
    context:
      form: filter_rows
      position: top_of_loop
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

- id: exit-semantics-risk
  description: EXIT semantics could change if a loop is added later (low)
  input_payload:
    cluster_id: c-0804
    check_id: Y_CHECK_CHECK_STATEMENT_POS
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_EXIT_FORM
      include: ZR_EXIT_FORM
      line: 22
      message: "EXIT in FORM — semantics depend on loop context"
    context:
      form: render_item
      stmt_kind: exit
      could_be_in_loop: true
  expected_fix_shape: context
  expected_confidence_range: [0.00, 0.69]

