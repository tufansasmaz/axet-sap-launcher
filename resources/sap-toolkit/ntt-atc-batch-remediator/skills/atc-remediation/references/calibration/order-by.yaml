# LLM-eval suite for the `order-by` pattern.

- id: vbap-binary-search-near
  description: SELECT VBAP followed by BINARY SEARCH within 10 lines (high)
  input_payload:
    cluster_id: c-0201
    check_id: CL_CI_TEST_DB_SEL_SORTORDER
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_ORDER_PROCESS
      include: ZR_ORDER_PROCESS
      line: 47
      message: "ORDER BY missing — BINARY SEARCH follows within 5 lines"
    context:
      ddic_table: VBAP
      primary_keys: [VBELN, POSNR]
      follow_up_binary_search: true
      follow_up_distance_lines: 5
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

