# LLM-eval suite for the `tables-to-changing` pattern.

- id: clean-no-header
  description: Single caller, no header-line implicit access (high)
  input_payload:
    cluster_id: c-0401
    check_id: CL_CI_TEST_OBSOLETE_STATEMENTS::TABLES
    finding_count: 1
    sample_finding:
      object_type: FUGR
      object_name: Z_FG_ORDER_CREATE
      include: LZ_FG_ORDER_CREATEU01
      line: 12
      message: "TABLES: forbidden in Cloud — FM ZORDER_CREATE"
    context:
      fm_name: z_order_create
      table: zorders
      caller_sites: 2
      uses_header_line_access: false
      rfc_enabled: false
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

