# LLM-eval suite for the `param-typing` pattern.

- id: single-caller-consistent
  description: Single caller passes bapi_amount (high)
  input_payload:
    cluster_id: c-0601
    check_id: Y_CHECK_PARAMETER_TYPING
    finding_count: 1
    sample_finding:
      object_type: CLAS
      object_name: ZCL_TAX_CALC
      include: ZCL_TAX_CALC==========CM001
      line: 12
      message: "Untyped CHANGING parameter `result`"
    context:
      method: calculate
      param: result
      callers:
        - inferred_type: bapi_amount
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

- id: multi-callers-conflict
  description: Multiple callers pass conflicting types (low)
  input_payload:
    cluster_id: c-0602
    check_id: Y_CHECK_PARAMETER_TYPING
    finding_count: 1
    sample_finding:
      object_type: CLAS
      object_name: ZCL_MULTI_USE
      include: ZCL_MULTI_USE==========CM001
      line: 7
      message: "Untyped CHANGING parameter — multiple caller types"
    context:
      method: process
      param: data
      callers:
        - inferred_type: vbap
        - inferred_type: string
  expected_fix_shape: context
  expected_confidence_range: [0.00, 0.69]

- id: interface-method
  description: Method implements an interface — type fixed externally (low)
  input_payload:
    cluster_id: c-0603
    check_id: Y_CHECK_PARAMETER_TYPING
    finding_count: 1
    sample_finding:
      object_type: CLAS
      object_name: ZCL_IF_IMPL
      include: ZCL_IF_IMPL==========CM001
      line: 11
      message: "Untyped parameter on interface-implementing method"
    context:
      method: handle
      param: payload
      implements_interface: true
  expected_fix_shape: context
  expected_confidence_range: [0.00, 0.69]

