# LLM-eval suite for the `nested-select-fae` pattern.

- id: orders-vendors-clean
  description: lt_orders -> LFA1 join on LIFNR, single key, no MODIFY of other fields (high)
  input_payload:
    cluster_id: c-0901
    check_id: CL_CI_TEST_DB_SEL_NESTED_LOOPS::SELECT_IN_LOOP
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_ORDER_ENRICH
      include: ZR_ORDER_ENRICH
      line: 22
      message: "Nested SELECT in LOOP — FAE candidate"
    context:
      driver_table: lt_orders
      target_table: LFA1
      join_keys: [LIFNR]
      driver_guarded_not_initial: true
      modify_widens: false
  expected_fix_shape: context
  expected_confidence_range: [0.85, 1.00]

