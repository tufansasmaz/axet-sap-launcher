# LLM-eval suite for the `deprecated-fm` pattern.

- id: ws-download-default-excs
  description: WS_DOWNLOAD with default SY-SUBRC routing (high)
  input_payload:
    cluster_id: c-0501
    check_id: CL_CI_TEST_FUNCTION_MODULE_USAGE::OBSOLETE_FM
    finding_count: 1
    sample_finding:
      object_type: PROG
      object_name: ZR_FILE_DUMP
      include: ZR_FILE_DUMP
      line: 42
      message: "WS_DOWNLOAD is obsolete"
    context:
      fm_name: WS_DOWNLOAD
      replacement_kind: class_method
      replacement: cl_gui_frontend_services=>gui_download
      exceptions_default_only: true
  expected_fix_shape: mechanical
  expected_confidence_range: [0.85, 1.00]

