    sap_note: 1875817
  - deprecated_fm: DYNP_VALUES_READ
    replacement_kind: function_module
    replacement_expression: "CALL FUNCTION 'DYNP_VALUES_READ'"
    notes: "Not deprecated as of 2024; included for completeness."
