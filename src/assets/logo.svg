<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Sabit renkli logo: favicon ve Windows simgesi (build/icon.*) bunu
       kullanıyor. Uygulama içindeki logo `src/components/AppLogo.tsx`; aynı
       çizim, renkleri seçili vurgudan. Zemin grafit kart (#17191c), ok
       varsayılan vurgu Amber (#e0a33f). -->
  <rect width="512" height="512" rx="104" fill="#17191c"/>

  <!-- Hız çizgileri: okun sol altında, kısadan uzuna üç paralel çizgi -->
  <line x1="86" y1="330" x2="118" y2="298" stroke="#e0a33f" stroke-width="14" stroke-linecap="round" opacity="0.35"/>
  <line x1="98" y1="372" x2="146" y2="324" stroke="#e0a33f" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <line x1="110" y1="414" x2="174" y2="350" stroke="#e0a33f" stroke-width="14" stroke-linecap="round" opacity="0.75"/>

  <!-- Ana işaret: ">" — başlatma, ilerleme -->
  <path d="M 208 140 L 372 256 L 208 372"
        fill="none" stroke="#e0a33f" stroke-width="56"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
